image:
  repository: ghcr.io/duncandoyle/snellius
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
install:
  # Pin the UI to one kgateway controller install: an install ID (e.g. kgw.kgateway)
  # or the controller's namespace/name. Empty shows all installs.
  pin: ""
installs:
  # Also show one install per GatewayClass controllerName that no detector
  # recognises, from Gateway API status alone.
  classOnly: false
delegation:
  # Selected delegation edges computed per install; 0 keeps the binary's
  # default (10000). A higher cap needs a higher memory limit.
  edgeCap: 0
# Data sources for the health checks. Each toggle drops its RBAC rule and its watch;
# the checks that need it then report "not available".
diagnostics:
  events: true       # Warning Events on controller and proxy Pods
  crds: true         # Gateway API CRD metadata
  proxyStats: true   # Envoy stats from each proxy Pod's port 9091
  endpoints: true    # Services and EndpointSlices (no check reads them yet)
  controllerLogs: false   # derived signals from controller logs; text is never kept
  controllerLogsNamespaces: [kgateway-system]   # a pods/log Role is created in each
# More flags for the UI binary, appended after the chart's own args,
# e.g. ["--poll-interval=10m"].
extraArgs: []
# Add-on hooks. All empty by default. Items are passed through unchanged.
rbac:
  # Rules appended to the ClusterRole. The operator's choice: these can widen
  # RBAC beyond the read-only default.
  extraRules: []
extraEnv: []            # env of the UI container
extraVolumes: []        # pod volumes
extraVolumeMounts: []   # mounts of the UI container
# Sidecars added to the pod. They share its network, so in local mode they
# can reach the loopback UI and API and see everything Snellius reads.
extraContainers: []
auth:
  # local: loopback only, reached with kubectl port-forward, no sign-in.
  # secure: listens on the Pod IP for a gateway route; needs auth.oidc.issuerURL, clientID and redirectURL.
  mode: local
  # Host names the UI answers to. Empty uses the binary's default.
  allowedHosts: []
  # Secure mode only. Users sign in with OIDC; Snellius reads with its own ServiceAccount.
  # Filtering per user arrives later in Phase 7.
  oidc:
    issuerURL: ""       # required in secure mode, https
    clientID: ""        # required in secure mode; the API server must accept it as an audience
    redirectURL: ""     # required in secure mode, https://<host>/auth/callback; register it at the IdP
    scopes: []          # empty uses the binary's default scopes
    clientSecret:
      existingSecret: ""   # Secret holding the client secret, mounted by the kubelet; empty is a public client
      key: client-secret   # key inside that Secret
    ca:
      existingConfigMap: ""   # ConfigMap with a PEM bundle for an IdP behind a private CA
      key: ca.pem             # key inside that ConfigMap
  session:
    idle: ""            # a session ends after this long without a request; empty uses 30m
    absolute: ""        # a session ends this long after sign-in; empty uses 8h
    cookieSecure: true  # false only for plain-HTTP testing
  authz:
    # How long an allowed permission check is reused, 30s to 15m; empty uses 60s. It is how
    # long a revoked permission stays visible; a longer TTL means fewer checks. Denials last 5m.
    cacheTTL: ""
    # Also show in lists, counts and facets the objects a viewer may only get by name
    # (resourceNames grants). Off by default: it costs one check per hidden object.
    namedGetScan: false
  # CIDRs of proxies whose X-Request-Id and X-Forwarded-For Snellius trusts (secure mode).
  trustedProxyCIDRs: []
# Pod hostAliases, for an IdP name that is not in DNS. Passed through unchanged.
hostAliases: []
audit:
  # Audit event levels written to the log.
  levels: [security, agent, reads, summaries]
httpRoute:
  # Expose the UI through an existing Gateway. Needs auth.mode: secure. Put
  # authentication and authorisation on the route, for example a kgateway
  # TrafficPolicy with OIDC or external auth that admits only operators.
  enabled: false
  parentRefs: []
  hostnames: []
serviceAccount:
  create: true
  name: ""
# Opt-in Go soft memory limit, rendered as GOMEMLIMIT (for example 300MiB). Empty sets none.
memoryLimit: ""
# With limits.memory the binary uses 90 % of it as its Go memory target.
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
