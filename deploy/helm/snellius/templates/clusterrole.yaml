# Read-only (plus TokenReview and SubjectAccessReview in secure mode); no Secrets, ConfigMaps or */proxy (design §8, D-013).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "snellius.fullname" . }}
  labels: {{- include "snellius.labels" . | nindent 4 }}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, grpcroutes, tcproutes, tlsroutes, backendtlspolicies, listenersets, referencegrants]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.x-k8s.io]
    resources: [xlistenersets]
    verbs: [get, list, watch]
  - apiGroups: [gateway.kgateway.dev]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces, pods]
    verbs: [get, list, watch]
  {{- if .Values.diagnostics.events }}
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  {{- end }}
  {{- if .Values.diagnostics.crds }}
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  {{- end }}
  {{- if .Values.diagnostics.endpoints }}
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  {{- if eq (include "snellius.authMode" .) "secure" }}
  # Secure mode validates bearer tokens with TokenReview and checks each user's
  # access with SubjectAccessReview. These are the only write verbs.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
